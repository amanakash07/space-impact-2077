<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Impact 2077</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#000;
    overflow:hidden;
    width:100vw; height:100vh;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    font-family:'Courier New', monospace;
}
canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

/* ── IN-GAME HUD ── */
#hud {
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px;
    font-family:'Courier New',monospace;
    font-size:clamp(12px,3vw,20px);
    font-weight:bold;
    color:#1a3d0a;
    letter-spacing:2px;
    pointer-events:none;
    z-index:10;
}

/* ── OVERLAY ── */
#overlay {
    position:fixed; inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
}
#overlay.hidden { display:none; }

/* hide touch controls while lobby/gameover is visible */
#overlay:not(.hidden) ~ #touchLeft,
#overlay:not(.hidden) ~ #touchRight,
#overlay:not(.hidden) ~ #touchFire { display:none !important; }

/* ══════════════════════════════════════
   FULL-SCREEN LOBBY
══════════════════════════════════════ */
#startPanel {
    position:absolute; inset:0;
    background:
        radial-gradient(ellipse at 50% 30%, rgba(173,255,47,0.08) 0%, transparent 65%),
        linear-gradient(180deg, #020d01 0%, #041202 50%, #020d01 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(30px,6vh,70px) clamp(20px,6vw,80px) clamp(20px,4vh,50px);
    text-align:center;
    overflow-y:auto;
}

/* title */
.lob-title {
    font-size:clamp(30px,7vw,80px);
    font-weight:bold;
    letter-spacing:clamp(6px,2vw,16px);
    color:#adff2f;
    text-shadow:
        0 0 10px #adff2f,
        0 0 30px rgba(173,255,47,0.6),
        0 0 60px rgba(173,255,47,0.3);
    line-height:1;
}
.lob-sub {
    margin-top:clamp(8px,1.5vh,16px);
    font-size:clamp(11px,2vw,18px);
    color:#6ab04c;
    letter-spacing:2px;
}

/* middle section */
.lob-mid {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px,2.5vh,28px);
    width:100%;
    max-width:480px;
}

/* controls line */
.lob-ctrl {
    font-size:clamp(10px,1.8vw,14px);
    color:#4d7c0f;
    letter-spacing:2px;
    border:1px solid #1a3d0a;
    padding:8px 20px;
}

/* x handle */
.lob-x-label {
    font-size:clamp(9px,1.5vw,12px);
    color:#4d7c0f;
    letter-spacing:3px;
    margin-bottom:6px;
}
#xInput {
    width:100%;
    max-width:320px;
    background:transparent;
    border:none;
    border-bottom:2px solid #2d6a1e;
    color:#adff2f;
    font-family:'Courier New',monospace;
    font-size:clamp(14px,2.5vw,20px);
    padding:6px 4px;
    outline:none;
    letter-spacing:2px;
    text-align:center;
    transition:border-color 0.2s;
}
#xInput:focus { border-bottom-color:#adff2f; }
#xInput::placeholder { color:#1a3d0a; }

/* start button */
#btnStart {
    padding:clamp(10px,2vh,16px) clamp(44px,9vw,90px);
    font-size:clamp(15px,2.8vw,24px);
    font-family:'Courier New',monospace;
    font-weight:bold;
    letter-spacing:5px;
    background:transparent;
    color:#adff2f;
    border:2px solid #adff2f;
    cursor:pointer;
    box-shadow:0 0 16px rgba(173,255,47,0.2), inset 0 0 16px rgba(173,255,47,0.04);
    transition:box-shadow 0.2s, background 0.2s;
}
#btnStart:hover  { background:rgba(173,255,47,0.08); box-shadow:0 0 28px rgba(173,255,47,0.45); }
#btnStart:active { background:rgba(173,255,47,0.15); }

/* top 3 scores */
.lob-scores-title {
    font-size:clamp(9px,1.6vw,12px);
    color:#2d6a1e;
    letter-spacing:4px;
    margin-bottom:8px;
}
#leaderList {
    list-style:none;
    width:100%;
    max-width:360px;
}
#leaderList li {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 0;
    border-bottom:1px solid #0d2208;
    font-size:clamp(11px,2vw,15px);
    letter-spacing:1px;
}
#leaderList li:last-child { border:none; }
.lrank  { color:#2d6a1e; min-width:30px; text-align:left; }
.lhandle a { color:#adff2f; text-decoration:none; }
.lhandle a:hover { text-shadow:0 0 6px #adff2f; }
.lhandle span { color:#2d6a1e; }
.lscore { color:#6ab04c; font-weight:bold; }
#leaderList li.lb-you .lhandle a,
#leaderList li.lb-you .lscore { color:#fff; }

/* footer */
.lob-footer {
    font-size:clamp(13px,2.5vw,20px);
    color:#2d6a1e;
    letter-spacing:2px;
}
.lob-footer a {
    color:#4d7c0f;
    text-decoration:none;
    font-weight:bold;
    transition:color 0.2s, text-shadow 0.2s;
}
.lob-footer a:hover {
    color:#adff2f;
    text-shadow:0 0 8px rgba(173,255,47,0.6);
}

/* ══════════════════════════════════════
   GAME-OVER CARD
══════════════════════════════════════ */
#overPanel {
    background:rgba(2,13,1,0.97);
    border:2px solid #adff2f;
    box-shadow:0 0 30px rgba(173,255,47,0.15);
    padding:clamp(24px,5vw,52px) clamp(32px,8vw,80px);
    text-align:center;
    color:#adff2f;
    max-width:92vw;
}
#overPanel h1 { font-size:clamp(24px,5vw,44px); letter-spacing:4px; margin-bottom:14px; }
#overPanel p  { font-size:clamp(12px,2.5vw,17px); color:#6ab04c; margin:6px 0; }
#oGlobal { font-size:clamp(9px,1.6vw,12px) !important; color:#2d6a1e !important; margin-top:8px !important; }
#overPanel button {
    margin-top:22px;
    padding:10px 44px;
    font-size:clamp(14px,3vw,20px);
    font-family:'Courier New',monospace;
    font-weight:bold;
    letter-spacing:3px;
    background:transparent;
    color:#adff2f;
    border:2px solid #adff2f;
    cursor:pointer;
}
#overPanel button:active { background:rgba(173,255,47,0.1); }

/* ── IN-GAME PLAYER TAG ── */
#playerTag {
    position:fixed; bottom:6px; left:10px;
    font-family:'Courier New',monospace;
    font-size:clamp(9px,1.8vw,12px);
    color:#2d6a1e;
    letter-spacing:1px;
    z-index:11;
    pointer-events:auto;
    text-decoration:none;
    display:none;
}
#playerTag:hover { color:#adff2f; }

/* ── TOUCH CONTROLS ── */
#touchLeft, #touchRight {
    position:fixed; bottom:50px;
    width:90px; height:90px;
    border-radius:50%;
    background:rgba(26,61,10,0.4);
    border:3px solid rgba(173,255,47,0.5);
    color:#adff2f; font-size:30px;
    display:none;
    align-items:center; justify-content:center;
    z-index:30; touch-action:none;
}
#touchLeft  { left:24px; }
#touchRight { left:130px; }
#touchFire {
    position:fixed; bottom:55px; right:24px;
    width:84px; height:84px;
    border-radius:50%;
    background:rgba(26,61,10,0.5);
    border:3px solid rgba(173,255,47,0.7);
    color:#adff2f;
    font-family:'Courier New',monospace;
    font-size:14px; font-weight:bold;
    display:none;
    align-items:center; justify-content:center;
    z-index:30; touch-action:none;
}
@media (pointer:coarse) {
    #touchLeft, #touchRight, #touchFire { display:flex; }
}

/* ── BOSS WARN ── */
#bossWarn {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-family:'Courier New',monospace;
    font-size:clamp(16px,4vw,28px);
    font-weight:bold;
    color:#1a3d0a;
    text-align:center;
    pointer-events:none;
    z-index:15;
    display:none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
    <span id="hScore">SCORE: 00000</span>
    <span id="hBest">BEST: 00000</span>
    <span id="hWave">WAVE: 1</span>
</div>

<a id="playerTag" href="#" target="_blank" rel="noopener"></a>

<div id="overlay">

    <!-- ══ LOBBY ══ -->
    <div id="startPanel">

        <div>
            <div class="lob-title">SPACE IMPACT 2077</div>
            <div class="lob-sub">Bad aliens are invading Earth &mdash; be the last line of defence</div>
        </div>

        <div class="lob-mid">

            <div class="lob-ctrl">
                ARROW / A D &nbsp;&mdash;&nbsp; MOVE &nbsp;&nbsp;|&nbsp;&nbsp; SPACE &nbsp;&mdash;&nbsp; SHOOT
            </div>

            <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
                <div class="lob-x-label">YOUR X HANDLE</div>
                <input id="xInput" type="text" maxlength="30"
                       placeholder="@yourusername"
                       spellcheck="false" autocomplete="off">
            </div>

            <button id="btnStart">&#9654;&nbsp; START</button>

            <div style="width:100%;text-align:center;">
                <div class="lob-scores-title">&#9733; TOP SCORES &#9733;</div>
                <ul id="leaderList">
                    <li><span class="lrank"></span><span class="lhandle"><span style="color:#1a3d0a">Loading...</span></span><span class="lscore"></span></li>
                </ul>
            </div>

        </div>

        <div class="lob-footer">
            Made with &#9829; &nbsp;&mdash;&nbsp; Follow&nbsp;
            <a href="https://x.com/0xAkashDev" target="_blank" rel="noopener">@0xAkashDev</a>
        </div>

    </div>

    <!-- ══ GAME OVER ══ -->
    <div id="overPanel" style="display:none">
        <h1>GAME OVER</h1>
        <p id="oScore">SCORE: 0</p>
        <p id="oBest">BEST: 0</p>
        <p id="oGlobal"></p>
        <button id="btnRestart">&#9654; PLAY AGAIN</button>
    </div>

</div>

<div id="touchLeft">&#9664;</div>
<div id="touchRight">&#9654;</div>
<div id="touchFire">FIRE</div>
<div id="bossWarn">&#9888; BOSS &#9888;</div>

<script>
const GIST_ID    = 'f53a8729a8ce3d92a75966adb5040dc8';
const GIST_TOKEN = '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';
const GIST_FILE  = 'scores.json';
const MAX_SCORES = 10;

function cleanHandle(v) {
    v = (v || '').trim();
    if (v.startsWith('@')) v = v.slice(1);
    return v.replace(/[^a-zA-Z0-9_]/g, '').slice(0, 30);
}
function xLink(h) {
    if (!h) return '<span style="color:#2d6a1e">Anonymous</span>';
    return `<a href="https://x.com/${h}" target="_blank" rel="noopener">@${h}</a>`;
}

async function fetchScores() {
    try {
        const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
            headers:{ 'Accept':'application/vnd.github+json' }
        });
        if (!res.ok) return null;
        const data = await res.json();
        const c = data.files[GIST_FILE]?.content;
        return c ? JSON.parse(c).scores || [] : [];
    } catch(e) { return null; }
}

async function writeScores(scores) {
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
        method:'PATCH',
        headers:{
            'Authorization':`token ${GIST_TOKEN}`,
            'Accept':'application/vnd.github+json',
            'Content-Type':'application/json'
        },
        body: JSON.stringify({ files:{ [GIST_FILE]:{ content: JSON.stringify({ scores }) } } })
    });
}

function renderLeaderboard(entries, myHandle) {
    const ul = document.getElementById('leaderList');
    if (!entries || entries.length === 0) {
        ul.innerHTML = '<li><span class="lrank"></span><span class="lhandle"><span style="color:#1a3d0a">'+(entries?'No scores yet — be first!':'Could not load')+'</span></span><span class="lscore"></span></li>';
        return;
    }
    const top = [...entries].sort((a,b)=>b.score-a.score).slice(0,3);
    const medals = ['#1','#2','#3'];
    ul.innerHTML = top.map((e,i) => {
        const mine = myHandle && cleanHandle(e.handle) === cleanHandle(myHandle);
        return `<li${mine?' class="lb-you"':''}>
            <span class="lrank">${medals[i]}</span>
            <span class="lhandle">${xLink(cleanHandle(e.handle))}</span>
            <span class="lscore">${String(e.score).padStart(6,'0')}</span>
        </li>`;
    }).join('');
}

async function loadAndRender() {
    const scores = await fetchScores();
    renderLeaderboard(scores, document.getElementById('xInput').value);
}

window.submitScore = async function(score, rawHandle) {
    const handle = cleanHandle(rawHandle) || 'Anonymous';
    const oGlobal = document.getElementById('oGlobal');
    try {
        const scores = await fetchScores() || [];
        const idx = scores.findIndex(e => cleanHandle(e.handle) === handle);
        if (idx >= 0) {
            if (scores[idx].score >= score) return;
            scores[idx] = { score, handle, ts: Date.now() };
        } else {
            scores.push({ score, handle, ts: Date.now() });
        }
        scores.sort((a,b)=>b.score-a.score);
        scores.splice(MAX_SCORES);
        await writeScores(scores);
        if (oGlobal) oGlobal.textContent = 'Score saved to leaderboard!';
    } catch(e) { if (oGlobal) oGlobal.textContent = ''; }
};

(function() {
    const xInput    = document.getElementById('xInput');
    const playerTag = document.getElementById('playerTag');
    const saved = localStorage.getItem('xHandle') || '';
    if (saved) xInput.value = saved;

    function applyTag() {
        const h = cleanHandle(xInput.value);
        localStorage.setItem('xHandle', xInput.value.trim());
        if (h) {
            playerTag.textContent = '@' + h;
            playerTag.href = 'https://x.com/' + h;
            playerTag.style.display = 'block';
        } else {
            playerTag.style.display = 'none';
        }
    }
    xInput.addEventListener('input', applyTag);
    applyTag();

    const observer = new MutationObserver(() => {
        if (!document.getElementById('overlay').classList.contains('hidden')) loadAndRender();
    });
    observer.observe(document.getElementById('overlay'), { attributes:true });

    loadAndRender();
})();
</script>

<script src="game.js"></script>
</body>
</html>
