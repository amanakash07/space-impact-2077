<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Impact 2077</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#000;
    overflow:hidden;
    width:100vw; height:100vh;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    font-family:'Courier New', monospace;
}
canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

/* ── IN-GAME HUD ── */
#hud {
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px;
    font-family:'Courier New',monospace;
    font-size:clamp(12px,3vw,20px);
    font-weight:bold;
    color:#1a3d0a;
    letter-spacing:2px;
    pointer-events:none;
    z-index:10;
}

/* ── OVERLAY ── */
#overlay {
    position:fixed; inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
}
#overlay.hidden { display:none; }

/* hide touch controls while lobby/gameover is visible */
#overlay:not(.hidden) ~ #touchLeft,
#overlay:not(.hidden) ~ #touchRight,
#overlay:not(.hidden) ~ #touchFire { display:none !important; }

/* ══════════════════════════════════════
   FULL-SCREEN LOBBY  — bright neon bg, dark text
══════════════════════════════════════ */
#startPanel {
    position:absolute; inset:0;
    background: #adff2f;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(28px,5vh,60px) clamp(20px,6vw,80px) clamp(18px,3.5vh,40px);
    text-align:center;
    overflow-y:auto;
}

/* TITLE */
.lob-title {
    font-size:clamp(38px,9vw,110px);
    font-weight:900;
    letter-spacing:clamp(6px,2vw,20px);
    color:#0a1f05;
    -webkit-text-stroke:1px #0a1f05;
    line-height:1;
}
.lob-sub {
    margin-top:clamp(10px,2vh,20px);
    font-size:clamp(17px,2.8vw,30px);
    font-weight:900;
    color:#1a3d0a;
    letter-spacing:1px;
}

/* MIDDLE */
.lob-mid {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px,2.8vh,32px);
    width:100%;
    max-width:680px;
}

/* CONTROLS */
.lob-ctrl {
    font-size:clamp(13px,2vw,20px);
    font-weight:bold;
    color:#1a3d0a;
    letter-spacing:2px;
    border:2px solid #1a3d0a;
    padding:10px 28px;
    width:100%;
    background:rgba(0,0,0,0.08);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
@media (max-width:480px) { .lob-ctrl { display:none; } }

/* X HANDLE */
.lob-x-label {
    font-size:clamp(12px,1.8vw,18px);
    font-weight:bold;
    color:#1a3d0a;
    letter-spacing:4px;
    margin-bottom:10px;
}
#xInput {
    width:100%;
    max-width:440px;
    background:rgba(0,0,0,0.12);
    border:none;
    border-bottom:3px solid #1a3d0a;
    color:#0a1f05;
    font-family:'Courier New',monospace;
    font-size:clamp(20px,3.2vw,32px);
    font-weight:bold;
    padding:8px 4px;
    outline:none;
    letter-spacing:2px;
    text-align:center;
    transition:border-color 0.2s;
}
#xInput:focus { border-bottom-color:#0a1f05; }
#xInput::placeholder { color:#4d7c0f; font-weight:normal; }

/* START BUTTON */
#btnStart {
    padding:clamp(12px,2.2vh,20px) clamp(52px,10vw,120px);
    font-size:clamp(20px,3.5vw,34px);
    font-family:'Courier New',monospace;
    font-weight:bold;
    letter-spacing:6px;
    background:#0a1f05;
    color:#adff2f;
    border:3px solid #0a1f05;
    cursor:pointer;
    transition:background 0.2s, transform 0.1s;
}
#btnStart:hover  { background:#1a3d0a; }
#btnStart:active { transform:scale(0.97); }

/* TOP 3 SCORES */
.lob-scores-title {
    font-size:clamp(13px,1.9vw,20px);
    font-weight:bold;
    color:#1a3d0a;
    letter-spacing:4px;
    margin-bottom:10px;
}
#leaderList {
    list-style:none;
    width:100%;
    max-width:520px;
}
#leaderList li {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 6px;
    border-bottom:2px solid rgba(0,0,0,0.15);
    font-size:clamp(15px,2.4vw,24px);
    font-weight:bold;
    letter-spacing:1px;
}
#leaderList li:last-child { border:none; }
.lrank  { color:#2d6a1e; min-width:44px; text-align:left; }
.lhandle a { color:#0a1f05; text-decoration:none; }
.lhandle a:hover { text-decoration:underline; }
.lhandle span { color:#2d6a1e; }
.lscore { color:#1a3d0a; }
#leaderList li.lb-you { background:rgba(0,0,0,0.1); }
#leaderList li.lb-you .lhandle a,
#leaderList li.lb-you .lscore { color:#000; }

/* FOOTER */
.lob-footer {
    font-size:clamp(18px,3vw,34px);
    font-weight:900;
    color:#1a3d0a;
    letter-spacing:2px;
    display:flex;
    align-items:center;
    gap:8px;
}
.lob-footer a {
    color:#0a1f05;
    text-decoration:none;
    transition:opacity 0.2s;
    display:inline-flex;
    align-items:center;
    gap:5px;
}
.lob-footer a:hover { opacity:0.7; }
.x-logo {
    display:inline-block;
    font-style:normal;
    font-weight:900;
    font-size:1em;
    line-height:1;
}

/* ══════════════════════════════════════
   GAME-OVER CARD
══════════════════════════════════════ */
#overPanel {
    background:rgba(2,13,1,0.97);
    border:2px solid #adff2f;
    box-shadow:0 0 30px rgba(173,255,47,0.15);
    padding:clamp(24px,5vw,52px) clamp(32px,8vw,80px);
    text-align:center;
    color:#adff2f;
    max-width:92vw;
}
#overPanel h1 { font-size:clamp(26px,5vw,48px); letter-spacing:4px; margin-bottom:14px; font-weight:bold; }
#overPanel p  { font-size:clamp(14px,2.8vw,22px); font-weight:bold; color:#6ab04c; margin:6px 0; }
#oGlobal { font-size:clamp(11px,1.8vw,15px) !important; color:#2d6a1e !important; font-weight:normal !important; margin-top:8px !important; }
#overPanel button {
    margin-top:22px;
    padding:12px 48px;
    font-size:clamp(16px,3vw,24px);
    font-family:'Courier New',monospace;
    font-weight:bold;
    letter-spacing:3px;
    background:transparent;
    color:#adff2f;
    border:2px solid #adff2f;
    cursor:pointer;
}
#overPanel button:active { background:rgba(173,255,47,0.1); }

/* IN-GAME PLAYER TAG */
#playerTag {
    position:fixed; bottom:6px; left:10px;
    font-family:'Courier New',monospace;
    font-size:clamp(9px,1.8vw,12px);
    color:#2d6a1e;
    letter-spacing:1px;
    z-index:11;
    pointer-events:auto;
    text-decoration:none;
    display:none;
}
#playerTag:hover { color:#adff2f; }

/* TOUCH CONTROLS */
#touchLeft, #touchRight {
    position:fixed; bottom:50px;
    width:90px; height:90px;
    border-radius:50%;
    background:rgba(26,61,10,0.4);
    border:3px solid rgba(173,255,47,0.5);
    color:#adff2f; font-size:30px;
    display:none;
    align-items:center; justify-content:center;
    z-index:30; touch-action:none;
}
#touchLeft  { left:24px; }
#touchRight { left:130px; }
#touchFire {
    position:fixed; bottom:55px; right:24px;
    width:84px; height:84px;
    border-radius:50%;
    background:rgba(26,61,10,0.5);
    border:3px solid rgba(173,255,47,0.7);
    color:#adff2f;
    font-family:'Courier New',monospace;
    font-size:14px; font-weight:bold;
    display:none;
    align-items:center; justify-content:center;
    z-index:30; touch-action:none;
}
@media (pointer:coarse) {
    #touchLeft, #touchRight, #touchFire { display:flex; }
}

#bossWarn {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-family:'Courier New',monospace;
    font-size:clamp(16px,4vw,28px);
    font-weight:bold;
    color:#1a3d0a;
    text-align:center;
    pointer-events:none;
    z-index:15;
    display:none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
    <span id="hScore">SCORE: 00000</span>
    <span id="hBest">BEST: 00000</span>
    <span id="hWave">WAVE: 1</span>
</div>

<a id="playerTag" href="#" target="_blank" rel="noopener"></a>

<div id="overlay">

    <!-- LOBBY -->
    <div id="startPanel">

        <div>
            <div class="lob-title">SPACE IMPACT 2077</div>
            <div class="lob-sub">Bad aliens are invading Earth. Be the last line of defence!</div>
        </div>

        <div class="lob-mid">

            <div class="lob-ctrl">
                ARROW / A D  -  MOVE &nbsp;&nbsp;|&nbsp;&nbsp; SPACE  -  SHOOT
            </div>

            <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
                <div class="lob-x-label">YOUR X HANDLE</div>
                <input id="xInput" type="text" maxlength="30"
                       placeholder="@yourusername"
                       spellcheck="false" autocomplete="off">
            </div>

            <button id="btnStart">&#9654; START</button>

            <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
                <div class="lob-scores-title">TOP SCORES</div>
                <ul id="leaderList">
                    <li><span class="lrank"></span><span class="lhandle"><span>Loading...</span></span><span class="lscore"></span></li>
                </ul>
            </div>

        </div>

        <div class="lob-footer">
            Made with &#9829; &nbsp; Follow &nbsp;
            <a href="https://x.com/0xAkashDev" target="_blank" rel="noopener"><i class="x-logo">&#120143;</i> @0xAkashDev</a>
        </div>

    </div>

    <!-- GAME OVER -->
    <div id="overPanel" style="display:none">
        <h1>GAME OVER</h1>
        <p id="oScore">SCORE: 0</p>
        <p id="oBest">BEST: 0</p>
        <button id="btnRestart">&#9654; PLAY AGAIN</button>
    </div>

</div>

<div id="touchLeft">&#9664;</div>
<div id="touchRight">&#9654;</div>
<div id="touchFire">FIRE</div>
<div id="bossWarn">&#9888; BOSS &#9888;</div>

<script>
// ================================================================
//  GLOBAL LEADERBOARD - Firebase Realtime Database (REST, no SDK)
//  Replace FIREBASE_URL with your database URL after setup
// ================================================================
const FIREBASE_URL = 'https://spaceimpact2077-default-rtdb.firebaseio.com';
const MAX_SCORES   = 10;

function cleanHandle(v) {
    v = (v || '').trim();
    if (v.startsWith('@')) v = v.slice(1);
    return v.replace(/[^a-zA-Z0-9_]/g, '').slice(0, 30);
}
function xLink(h) {
    if (!h || h === 'Anonymous') return '<span style="color:#2d6a1e">Anonymous</span>';
    return `<a href="https://x.com/${h}" target="_blank" rel="noopener"><i class="x-logo">&#120143;</i> @${h}</a>`;
}

const configured = () => FIREBASE_URL !== 'REPLACE_WITH_YOUR_FIREBASE_URL';

async function fetchScores() {
    if (!configured()) return [];
    try {
        const res = await fetch(`${FIREBASE_URL}/scores.json`);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data) return [];
        return Object.values(data);
    } catch(e) { return null; }
}

async function pushScore(entry) {
    await fetch(`${FIREBASE_URL}/scores.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
    });
}

async function deleteKey(key) {
    await fetch(`${FIREBASE_URL}/scores/${key}.json`, { method: 'DELETE' });
}

function renderLeaderboard(entries, myHandle) {
    const ul = document.getElementById('leaderList');
    if (!configured()) {
        ul.innerHTML = '<li style="justify-content:center"><span style="color:#1a3d0a;font-size:14px">Leaderboard coming soon</span></li>';
        return;
    }
    if (!entries) {
        ul.innerHTML = '<li style="justify-content:center"><span style="color:#1a3d0a">Could not load</span></li>';
        return;
    }
    if (entries.length === 0) {
        ul.innerHTML = '<li style="justify-content:center"><span style="color:#2d6a1e">No scores yet. Be first!</span></li>';
        return;
    }
    const top = [...entries].sort((a,b) => b.score - a.score).slice(0, 3);
    const ranks = ['#1','#2','#3'];
    ul.innerHTML = top.map((e, i) => {
        const mine = myHandle && cleanHandle(e.handle) === cleanHandle(myHandle);
        return `<li${mine ? ' class="lb-you"' : ''}>
            <span class="lrank">${ranks[i]}</span>
            <span class="lhandle">${xLink(e.handle)}</span>
            <span class="lscore">${String(e.score).padStart(6,'0')}</span>
        </li>`;
    }).join('');
}

async function loadAndRender() {
    const scores = await fetchScores();
    renderLeaderboard(scores, document.getElementById('xInput').value);
}

window.submitScore = async function(score, rawHandle) {
    if (!configured()) return;
    const handle = cleanHandle(rawHandle) || 'Anonymous';
    const oGlobal = document.getElementById('oGlobal');
    try {
        // fetch all entries as object to get keys for deletion
        const res = await fetch(`${FIREBASE_URL}/scores.json`);
        const raw = res.ok ? await res.json() : null;
        const existing = raw ? Object.entries(raw) : [];

        // find if this handle already has a score
        const prev = existing.find(([, v]) => cleanHandle(v.handle) === handle);
        if (prev) {
            if (prev[1].score >= score) return; // not an improvement
            await deleteKey(prev[0]);            // remove old entry
        }

        await pushScore({ score, handle, ts: Date.now() });

        // trim to top MAX_SCORES
        const all = await fetch(`${FIREBASE_URL}/scores.json`).then(r => r.json());
        if (all) {
            const sorted = Object.entries(all).sort((a,b) => b[1].score - a[1].score);
            for (let i = MAX_SCORES; i < sorted.length; i++) {
                await deleteKey(sorted[i][0]);
            }
        }

    } catch(e) {
    }
};

// username persistence + in-game tag
(function() {
    const xInput    = document.getElementById('xInput');
    const playerTag = document.getElementById('playerTag');
    const saved = localStorage.getItem('xHandle') || '';
    if (saved) xInput.value = saved;

    function applyTag() {
        const h = cleanHandle(xInput.value);
        localStorage.setItem('xHandle', xInput.value.trim());
        if (h) {
            playerTag.textContent = '@' + h;
            playerTag.href = 'https://x.com/' + h;
            playerTag.style.display = 'block';
        } else {
            playerTag.style.display = 'none';
        }
    }
    xInput.addEventListener('input', applyTag);
    applyTag();

    const observer = new MutationObserver(() => {
        if (!document.getElementById('overlay').classList.contains('hidden')) loadAndRender();
    });
    observer.observe(document.getElementById('overlay'), { attributes: true });

    loadAndRender();
})();
</script>

<script src="game.js"></script>
</body>
</html>
